services:
  nginx:
    image: nginx:1.27-alpine
    container_name: chezvous_dep_nginx
    restart: unless-stopped
    ports:
      - "${API_PORT:-8003}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docs:/var/www/html/docs:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - chezvous_dep_net

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: chezvous_dep_php
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./src:/var/www/html/src:ro
      - ./public:/var/www/html/public:ro
      - ./docs:/var/www/html/docs
      - ./tests:/var/www/html/tests:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chezvous_dep_net

  mysql:
    image: mysql:8.4
    container_name: chezvous_dep_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-chezvous_departamentos}
      MYSQL_USER: ${DB_USERNAME:-chezvous_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-chezvous_pass_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-chezvous_root_secret}
      TZ: America/Sao_Paulo
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-chezvous_root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - chezvous_dep_net

  redis:
    image: redis:7.4-alpine
    container_name: chezvous_dep_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chezvous_dep_net

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: chezvous_dep_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-chezvous_user}
      PMA_PASSWORD: ${DB_PASSWORD:-chezvous_pass_secret}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8004}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - chezvous_dep_net

volumes:
  mysql_data:

networks:
  chezvous_dep_net:
    driver: bridge

