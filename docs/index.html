<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chez Vous API · Documentação Swagger (OpenAPI 3.0)</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    body {
      margin: 0;
      background: #0A2016;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .chezvous-topbar {
      background: linear-gradient(90deg, #0A2016 0%, #143324 100%);
      border-bottom: 1px solid rgba(212, 195, 163, 0.35);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chezvous-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      font-size: 16px;
      color: #ffffff;
    }
    .chezvous-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #D4C3A3;
      box-shadow: 0 0 12px #D4C3A3;
    }
    .chezvous-pill {
      font-size: 12px;
      background: rgba(212, 195, 163, 0.14);
      color: #D4C3A3;
      border: 1px solid rgba(212, 195, 163, 0.4);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }
    #swagger-ui {
      background: #ffffff;
      min-height: calc(100vh - 55px);
    }
  </style>
</head>
<body>
  <div class="chezvous-topbar">
    <div class="chezvous-brand">
      <span class="chezvous-dot"></span>
      <span>CHEZ VOUS · API DE DEPARTAMENTOS & COLABORADORES</span>
    </div>
    <span class="chezvous-pill">Porta 8003 · Gestão de Setores, Centros de Custo e Pessoas Cadastradas</span>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function () {
      const basePath = window.location.pathname.replace(/\/docs\/?(index\.html)?$/, '');
      window.ui = SwaggerUIBundle({
        url: (basePath ? basePath : '') + '/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        displayRequestDuration: true,
        filter: true,
        persistAuthorization: true,
      });
    };
  </script>
</body>
</html>
